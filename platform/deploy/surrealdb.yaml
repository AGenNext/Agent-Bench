# SurrealDB server for the platform.
#
# Fixes the CrashLoopBackOff seen with `replicas: 3` of `surrealdb:latest`:
#   1. The image entrypoint needs an explicit `start ...` command with bind
#      address + root auth, or the container exits immediately.
#   2. A single RocksDB store is SINGLE-NODE. You cannot run 3 replicas over one
#      RWO volume — they crashloop. Use ONE replica with a persistent volume
#      (below). For HA use SurrealDB Cloud Dedicated, or SurrealDS (the
#      distributed storage tier) when it ships — NOT a self-managed KV cluster.
#
# This manifest runs a single durable node — correct for getting green first.
---
apiVersion: v1
kind: Namespace
metadata:
  name: surrealdb
---
apiVersion: v1
kind: Secret
metadata:
  name: surrealdb-auth
  namespace: surrealdb
type: Opaque
stringData:
  user: root
  # CHANGE ME — and prefer an ExternalSecret in production.
  pass: "change-me-root-pass"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surrealdb-data
  namespace: surrealdb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  # k3s default; swap for longhorn/rook-ceph in production.
  storageClassName: local-path
---
apiVersion: apps/v1
kind: StatefulSet            # stateful, stable identity + the PVC above
metadata:
  name: surrealdb
  namespace: surrealdb
spec:
  serviceName: surrealdb
  replicas: 1                # SINGLE node with SurrealKV. Do NOT scale this.
  selector:
    matchLabels: { app: surrealdb }
  template:
    metadata:
      labels: { app: surrealdb }
    spec:
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:v2.1.4   # pin, don't use :latest
          # The fix: an explicit start command with bind + auth + storage path.
          # RocksDB is the recommended on-disk server engine (SurrealKV is beta,
          # aimed at embedded/local-first; the platform binary uses it embedded).
          args:
            - start
            - --bind=0.0.0.0:8000
            - --user=$(SURREAL_USER)
            - --pass=$(SURREAL_PASS)
            - --log=info
            - rocksdb://data/agentbench.db
          env:
            - name: SURREAL_USER
              valueFrom: { secretKeyRef: { name: surrealdb-auth, key: user } }
            - name: SURREAL_PASS
              valueFrom: { secretKeyRef: { name: surrealdb-auth, key: pass } }
          ports:
            - { name: http, containerPort: 8000 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surrealdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
  namespace: surrealdb
spec:
  selector: { app: surrealdb }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }

# --------------------------------------------------------------------------
# HA option: SurrealDB separates compute (query nodes) from storage. For an
# HA, horizontally scalable store, run query nodes against a distributed
# storage tier so the dataset no longer lives on a single node:
#
#   - SurrealDB Cloud (Dedicated) — managed multi-node HA today; point the
#     platform at its endpoint via AGENTBENCH_DB_URL (no in-cluster StatefulSet).
#   - SurrealDS — the self-hosted distributed transactional storage layer
#     (Enterprise, coming soon). When it ships, query nodes become a stateless
#     Deployment (replicas: N) over shared SurrealDS storage.
#
# Until then this single durable RocksDB node is the supported self-hosted path;
# back it up at the filesystem level. (See manage/deployment.)
# --------------------------------------------------------------------------
