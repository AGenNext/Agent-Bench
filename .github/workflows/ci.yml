name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: platform

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "default"
            flags: ""
          - features: "server"
            flags: "--features server"
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --locked ${{ matrix.flags }} -- -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "default"
            flags: ""
          - features: "server"
            flags: "--features server"
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked ${{ matrix.flags }} --verbose

  audit:
    name: cargo-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory for now: the backlog of existing advisories is tracked separately
    # (see Dependabot). Flip `continue-on-error` to false once the backlog is
    # cleared so new vulnerabilities hard-block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
